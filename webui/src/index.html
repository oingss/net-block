<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="styles/index.css" type="text/css" rel="stylesheet">
  <script type="module" src="scripts/index.js" type="text/javascript"></script>
  <script type="module" src="scripts/mmrl.js" type="text/javascript"></script>
</head>

<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-200 root_layout min-h-screen">
  <!-- Search Bar -->
  <div class="p-4 flex items-center gap-2">
    <!-- Filter (breadcrumb/menu) button -->
    <button
      id="filter-btn"
      type="button"
      aria-haspopup="dialog"
      aria-expanded="false"
      title="筛选"
      class="shrink-0 flex items-center justify-center w-10 h-10 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring focus:ring-blue-300 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="14" y2="12"></line>
        <line x1="4" y1="18" x2="10" y2="18"></line>
      </svg>
    </button>

    <input 
      type="search" 
      id="search" 
      placeholder="Search App" 
      class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200">
  </div>

  <!-- Apps List -->
  <div id="apps-list" class="space-y-4 px-4"></div>

  <!-- App Template -->
  <template id="app-template">
    <div class="border border-gray-300 rounded-md p-4 dark:border-gray-700">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3 min-w-0 max-w-[75%]">
          <!-- App icon -->
          <img class="app-icon w-9 h-9 rounded-md shrink-0 bg-gray-100 dark:bg-gray-700 object-contain hidden" alt="">
          <!-- App name + package name label -->
          <div class="truncate min-w-0">
            <p class="app-label m-0 text-sm font-medium dark:text-gray-100 truncate"></p>
            <p class="app-pkg m-0 text-xs text-gray-500 dark:text-gray-400 truncate"></p>
          </div>
        </div>
        <!-- Switch -->
        <label class="relative inline-flex items-center cursor-pointer ml-auto shrink-0">
          <input type="checkbox" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:bg-blue-600 peer-focus:ring-2 peer-focus:ring-blue-300"></div>
          <div class="absolute w-4 h-4 bg-white rounded-full border border-gray-300 left-1 top-1 transition-transform peer-checked:translate-x-5 dark:border-gray-600 dark:peer-checked:border-white"></div>
        </label>
      </div>
    </div>
  </template>

  <!-- Filter Modal -->
  <div id="filter-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div id="filter-modal-panel" role="dialog" aria-modal="true" aria-label="筛选" class="w-full max-w-xs rounded-lg bg-white dark:bg-gray-800 shadow-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
        <p class="m-0 text-sm font-semibold text-gray-700 dark:text-gray-200">显示筛选</p>
      </div>
      <div class="py-2">
        <button type="button" data-filter="all" class="filter-option w-full text-left px-4 py-3 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between">
          <span>全部显示</span>
          <svg class="filter-check w-4 h-4 text-blue-600 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button type="button" data-filter="hide-system" class="filter-option w-full text-left px-4 py-3 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between">
          <span>隐藏系统APP</span>
          <svg class="filter-check w-4 h-4 text-blue-600 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button type="button" data-filter="hide-third-party" class="filter-option w-full text-left px-4 py-3 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between">
          <span>隐藏第三方APP</span>
          <svg class="filter-check w-4 h-4 text-blue-600 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>
</body>

</html>
